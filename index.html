<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>捞金鱼</title>
<!-- 添加到主屏幕后全屏启动（iPhone 只能靠这个全屏） -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="捞金鱼">
<meta name="theme-color" content="#06121f">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0; height: 100%; overflow: hidden;
        background: #06121f; color: #fff;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none; -webkit-user-select: none;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }

    .btnrow { display: flex; align-items: center; gap: 10px; pointer-events: none; }
    .btnrow > * { pointer-events: auto; }
    .topbar {
        position: fixed; top: 0; left: 0; right: 0; z-index: 5;
        display: flex; align-items: center; gap: 10px; padding: 12px 16px;
        pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .pill {
        background: rgba(0, 0, 0, .35); backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, .15); border-radius: 999px;
        padding: 8px 14px; font-size: 15px; font-weight: 600; white-space: nowrap;
    }
    .money { color: #ffd970; transition: transform .15s; }
    .money.bump { transform: scale(1.18); }
    .spacer { flex: 1; }
    .hsw { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0.01; cursor: pointer; }
    .btn {
        background: linear-gradient(#ffcf5a, #f0a020); color: #4a2a00;
        border: none; border-radius: 999px; padding: 10px 18px;
        font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit;
        box-shadow: 0 3px 0 #b8700a, 0 6px 14px rgba(0, 0, 0, .3);
        transition: transform .08s; white-space: nowrap;
    }
    .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #b8700a; }
    .btn.ghost { background: rgba(255, 255, 255, .12); color: #fff; box-shadow: none; border: 1px solid rgba(255, 255, 255, .25); }
    .btn.feeding { background: linear-gradient(#5aa874, #3f8a5a); border-color: transparent; box-shadow: 0 3px 0 #2a5e3d; }
    .btn.red { background: linear-gradient(#ff8a7a, #e0503c); color: #fff; box-shadow: 0 3px 0 #9a2a1c; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .hidden { display: none !important; }

    .hint {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 5;
        pointer-events: none; font-size: 15px; opacity: .9; text-align: center;
        text-shadow: 0 2px 6px rgba(0, 0, 0, .7); white-space: nowrap;
    }

    .modal-bg {
        position: fixed; inset: 0; z-index: 20;
        background: rgba(0, 8, 20, .6); backdrop-filter: blur(3px);
        display: none; align-items: center; justify-content: center;
    }
    .modal-bg.show { display: flex; animation: fadeIn .2s; }
    .modal {
        background: linear-gradient(#173350, #0e2238);
        border: 1px solid rgba(255, 255, 255, .18); border-radius: 20px;
        padding: 22px; width: min(92vw, 720px); max-height: 86vh; overflow: auto;
        box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        animation: pop .4s cubic-bezier(.3, 1.6, .5, 1);
    }
    /* 隐藏弹窗滚动条（仍可滚动），避免动画/粒子瞬间溢出时滚动条闪一下 */
    .modal { scrollbar-width: none; }
    .modal::-webkit-scrollbar { display: none; }
    .modal h2 { margin: 0 0 6px; font-size: 24px; }
    /* 弹窗右上角的操作按钮（关闭 / 回鱼缸）：滚动时一直停在右上角，不用往下滑找 */
    .mtop { position: sticky; top: 0; float: right; z-index: 3; margin: -6px -6px 6px 10px; }
    .mtop .btn { padding: 9px 18px; }
    .modal .sub { opacity: .7; font-size: 14px; margin-bottom: 16px; }
    .modal .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .card {
        background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .12);
        border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .card.locked { opacity: .45; }
    .card .title { font-size: 18px; font-weight: 700; }
    .card .meta { font-size: 13px; opacity: .75; line-height: 1.5; }
    .card .swatch { height: 46px; border-radius: 10px; }

    .catch-list { display: flex; flex-direction: column; gap: 8px; }
    .catch-row {
        display: flex; align-items: center; gap: 12px;
        background: rgba(255, 255, 255, .06); border-radius: 12px; padding: 8px 12px;
        animation: slideIn .35s both;
    }
    .catch-row canvas { position: static; width: 64px; height: 40px; }
    .catch-row .name { font-weight: 700; }
    .catch-row .val { margin-left: auto; color: #ffd970; font-weight: 700; }
    .tag { font-size: 11px; font-weight: 800; padding: 2px 6px; border-radius: 6px; margin-left: 6px; }
    .tag.new { background: #ff5a7a; color: #fff; }

    .dex-section { margin-bottom: 18px; }
    .dex-section h3 { margin: 0 0 8px; font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
    .dex-section h3 small { opacity: .6; font-weight: 400; }
    .dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
    .dex-card {
        background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .1);
        border-radius: 12px; padding: 10px; text-align: center; font-size: 13px;
    }
    .dex-card canvas { position: static; width: 96px; height: 60px; display: block; margin: 0 auto 4px; }
    .dex-card .n { font-weight: 700; font-size: 15px; }
    .dex-card .m { opacity: .65; margin-top: 2px; }

    .pop {
        position: fixed; z-index: 10; transform: translate(-50%, calc(-100% - 18px));
        background: linear-gradient(#1d3d5e, #12283f); border: 1px solid rgba(255, 255, 255, .2);
        border-radius: 14px; padding: 12px 14px; min-width: 170px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, .45); animation: pop .3s cubic-bezier(.3, 1.6, .5, 1);
    }
    .pop .n { font-weight: 800; font-size: 16px; }
    .pop .m { font-size: 13px; opacity: .75; margin: 4px 0 10px; }
    .pop .row { display: flex; gap: 8px; }
    .pop .btn { padding: 7px 12px; font-size: 13px; }
    .pop.below { transform: translate(-50%, 18px); }
    .pop .n { padding-right: 26px; }
    .pop .pclose {
        position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; padding: 0; border: none; border-radius: 50%;
        background: none; color: rgba(255, 255, 255, .6); font-size: 16px; line-height: 26px; cursor: pointer; font-family: inherit;
    }
    .pop .pclose:active { background: rgba(255, 255, 255, .12); }
    .pop .sci { font-size: 12px; font-weight: 600; opacity: .6; }
    .pop input {
        flex: 1; min-width: 0; width: 110px; padding: 7px 10px; font-size: 14px; font-family: inherit; color: #fff;
        background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .3); border-radius: 10px; outline: none;
    }
    .pop input:focus { border-color: #6fb886; }
    /* 起名 / 确定 用偏暗的绿色，和黄色的「卖出」区分开 */
    .pop .btn.name { background: linear-gradient(#5aa874, #3f8a5a); color: #fff; box-shadow: 0 3px 0 #2a5e3d; }
    .pop .btn.name:active { box-shadow: 0 1px 0 #2a5e3d; }

    .toast {
        position: fixed; top: 70px; left: 50%; transform: translateX(-50%); z-index: 30;
        background: rgba(10, 25, 45, .9); border: 1px solid rgba(255, 220, 120, .5);
        border-radius: 999px; padding: 10px 20px; font-weight: 700; font-size: 15px;
        pointer-events: none; animation: toastIn .3s cubic-bezier(.3, 1.6, .5, 1);
    }

    .topbar { padding-top: max(12px, env(safe-area-inset-top)); }
    .hint { bottom: max(22px, env(safe-area-inset-bottom)); }
    /* 手机竖屏：顶栏换两行、按钮缩小 */
    @media (max-width: 640px) {
        .topbar { flex-wrap: wrap; gap: 6px; padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top)); }
        .spacer { flex-basis: 100%; height: 0; }
        .pill { padding: 6px 10px; font-size: 13px; }
        .btn { padding: 8px 12px; font-size: 13px; }
        /* 按钮那一排永远一行：按屏幕宽度一起缩，放不下就把字收成省略号，不换行 */
        .btnrow { flex: 1 1 100%; min-width: 0; gap: 1.6vw; }
        .btnrow .btn { flex: 0 1 auto; min-width: 0; padding: 8px clamp(6px, 2.6vw, 12px); font-size: clamp(11px, 3.4vw, 13px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hint { white-space: normal; width: 92vw; font-size: 13px; bottom: max(12px, env(safe-area-inset-bottom)); }
        .modal { padding: 16px; border-radius: 16px; }
        .modal h2 { font-size: 20px; }
        .cards { grid-template-columns: 1fr; }
        .dex-grid { grid-template-columns: repeat(2, 1fr); }
        .toast { top: 110px; font-size: 13px; white-space: nowrap; }
    }
    .a2hs {
        position: fixed; left: 50%; transform: translateX(-50%); z-index: 15;
        bottom: max(54px, calc(env(safe-area-inset-bottom) + 40px)); width: min(92vw, 420px);
        background: rgba(10, 25, 45, .92); border: 1px solid rgba(255, 220, 120, .45); border-radius: 14px;
        padding: 10px 36px 10px 14px; font-size: 13px; line-height: 1.6; box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
    }
    .a2hs b { color: #ffd970; }
    .a2hs .x { position: absolute; right: 6px; top: 4px; padding: 4px 8px; font-size: 16px; opacity: .7; cursor: pointer; }
    /* 图鉴点亮 / 集齐庆祝 */
    .dex-card.lit { position: relative; border-color: #ffd34a; box-shadow: 0 0 0 1px #ffd34a, 0 0 16px rgba(255, 211, 74, .5); animation: litPulse 1.6s ease-in-out infinite; }
    .dex-card.lit::after { content: 'NEW'; position: absolute; top: 6px; right: 6px; background: #ff5a7a; font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 5px; }
    @keyframes litPulse { 50% { box-shadow: 0 0 0 1px #ffd34a, 0 0 30px rgba(255, 211, 74, .85); } }
    .pond-badge { color: #ffd34a; font-size: 13px; font-weight: 700; }
    .title-pill { color: #ffd970; border-color: rgba(255, 211, 74, .6); }
    .celebrate { text-align: center; position: relative; overflow: hidden; padding: 6px 0; }
    .celebrate h2 { margin-top: 6px; }
    .celebrate .fishes { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; margin: 18px 0 12px; }
    .lit-fish { position: relative; width: 110px; height: 70px; }
    .lit-fish canvas { position: absolute !important; inset: 0; width: 110px !important; height: 70px !important; transition: opacity .5s, transform .6s cubic-bezier(.3, 1.6, .5, 1); }
    .lit-fish::before { content: ''; position: absolute; inset: -20px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 214, 90, .55), transparent 65%); opacity: 0; transition: opacity .6s; }
    .lit-fish .color { opacity: 0; transform: scale(.5) rotate(-12deg); }
    .celebrate.on .lit-fish .color { opacity: 1; transform: none; }
    .celebrate.on .lit-fish .sil { opacity: 0; }
    .celebrate.on .lit-fish::before { opacity: 1; }
    .badge-big { font-size: 76px; line-height: 1; margin: 6px 0 4px; filter: drop-shadow(0 0 18px rgba(255, 211, 74, .8)); animation: badgeIn .8s cubic-bezier(.3, 1.6, .5, 1); }
    @keyframes badgeIn { from { transform: scale(0) rotate(-40deg); } }
    .reward-list { text-align: left; display: inline-block; line-height: 2.1; margin-top: 8px; font-size: 15px; }
    .spk { position: absolute; width: 7px; height: 7px; border-radius: 50%; pointer-events: none; background: #ffd34a; box-shadow: 0 0 8px #ffd34a; animation: spk 1s ease-out forwards; }
    @keyframes spk { to { transform: translate(var(--dx), var(--dy)) scale(.2); opacity: 0; } }
    .confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 26; pointer-events: none; }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes pop { from { transform: scale(.6); opacity: 0; } }
    .pop { animation-name: popUp; }
    @keyframes popUp { from { opacity: 0; transform: translate(-50%, calc(-100% - 6px)) scale(.7); } }
    @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -20px); } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="topbar">
    <div class="pill money" id="moneyPill">¥ 0</div>
    <div class="pill title-pill hidden" id="titlePill">👑 捞鱼大师</div>
    <div class="pill" id="tankPill">鱼缸 0 条</div>
    <div class="pill hidden" id="pondPill"></div>
    <div class="spacer"></div>
    <div class="btnrow">
    <button class="btn ghost" id="btnDebug" title="调试：门票免费、鱼塘全开（快捷键 D）">∞ 调试：关</button>
    <button class="btn ghost" id="btnFeed">🍤 投喂</button>
    <button class="btn ghost" id="btnSellCommon">卖掉普通鱼</button>
    <button class="btn ghost" id="btnDex">📖 图鉴</button>
    <button class="btn" id="btnGo">🎣 去捞鱼</button>
    </div>
</div>
<div class="hint" id="hint"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="pop hidden" id="fishPop"></div>
<div class="a2hs hidden" id="a2hs"><span class="x" id="a2hsX">✕</span>想全屏玩？点 Safari 底部的 <b>分享</b> → <b>添加到主屏幕</b>，从桌面图标打开就是全屏。</div>

<script>
// ============================================================
// 数据
// ============================================================
const TAU = Math.PI * 2;
const RARITY = [
    { name: '普通', color: '#cfe3f5' },
    { name: '稀有', color: '#7fd0ff' },
    { name: '传说', color: '#ffcf4a' },
];
// weight=重量(决定纸能不能撑住) value=基础售价 shy=胆小程度 spawn=出现权重
const SPECIES = [
    { id: 'baixiao',   pond: 0, name: '小白',   rarity: 0, c1: '#f4f7fb', c2: '#cfd8e3', pat: 'plain',    len: 26, weight: 9,  value: 7,    shy: 1.0, spawn: 45 },
    { id: 'chengwei',  pond: 0, name: '橙尾',   rarity: 0, c1: '#ff9a3c', c2: '#ffe0b0', pat: 'tail',     len: 28, weight: 11, value: 10,   shy: 1.0, spawn: 35 },
    { id: 'hongdian',  pond: 0, name: '红点',   rarity: 1, c1: '#fff4ec', c2: '#e8452c', pat: 'spots',    len: 32, weight: 15, value: 35,   shy: 1.8, spawn: 8 },
    { id: 'jinlin',    pond: 0, name: '金鳞',   rarity: 2, c1: '#ffd54a', c2: '#fff3b0', pat: 'glow', glow: '#ffcc33', len: 38, weight: 20, value: 150, shy: 2.8, spawn: 1.5 },
    { id: 'qingjiang', pond: 1, name: '青鳉',   rarity: 0, c1: '#5fe0d0', c2: '#c8fff6', pat: 'plain',    len: 28, weight: 11, value: 28,   shy: 1.1, spawn: 45 },
    { id: 'hongbai',   pond: 1, name: '红白锦', rarity: 0, c1: '#fbfbf7', c2: '#e8402a', pat: 'koi',      len: 34, weight: 15, value: 40,   shy: 1.1, spawn: 35 },
    { id: 'molong',    pond: 1, name: '墨龙',   rarity: 1, c1: '#23262e', c2: '#5a6070', pat: 'tail', eye: '#e8e8e8', len: 38, weight: 20, value: 95, shy: 1.9, spawn: 8 },
    { id: 'yinghua',   pond: 1, name: '樱花锦', rarity: 2, c1: '#ffd6e4', c2: '#ff6f9f', pat: 'koi', glow: '#ff9ec4', len: 42, weight: 22, value: 420, shy: 2.9, spawn: 1.5 },
    { id: 'yingguang', pond: 2, name: '萤光',   rarity: 0, c1: '#b6ff7a', c2: '#eaffc8', pat: 'plain', glow: '#9dff5a', soft: true, len: 28, weight: 12, value: 95, shy: 1.2, spawn: 45 },
    { id: 'liuli',     pond: 2, name: '琉璃',   rarity: 0, c1: '#6fa8ff', c2: '#e0ecff', pat: 'stripe',   len: 34, weight: 16, value: 130,  shy: 1.2, spawn: 35 },
    { id: 'xingban',   pond: 2, name: '星斑',   rarity: 1, c1: '#2a2f6a', c2: '#ffffff', pat: 'stars', eye: '#e8e8ff', len: 38, weight: 21, value: 320, shy: 2.0, spawn: 8 },
    { id: 'yueguang',  pond: 2, name: '月光',   rarity: 2, c1: '#e8f0ff', c2: '#ffffff', pat: 'glow', glow: '#cfe0ff', len: 46, weight: 24, value: 1500, shy: 3.0, spawn: 1.5 },
];
const SP = Object.fromEntries(SPECIES.map(s => [s.id, s]));
const PONDS = [
    { name: '清水小溪', ticket: 80,   net: 100, top: '#3a9cb5', bot: '#145570', desc: '新手鱼塘，鱼不太怕人' },
    { name: '荷花池',   ticket: 250,  net: 130, top: '#24735f', bot: '#0c3a35', desc: '锦鲤出没，荷叶底下藏着鱼' },
    { name: '月光池',   ticket: 1200, net: 170, top: '#2b2b72', bot: '#0a0a28', desc: '夜里才开的池子，鱼会发光' },
];
const UNLOCK_NEED = 3;   // 上一个鱼塘集齐几种解锁下一个
const NET_R = 58;

// ============================================================
// 存档
// ============================================================
const SAVE_KEY = 'fishScoop_v1';
function load() { try { return JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { return null; } }
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }
let S = load() || { money: 100, tank: [], dex: {}, uid: 1, seen: false };

const fishValue = f => Math.max(1, Math.round(SP[f.sp].value * f.size));
const dexCountPond = i => SPECIES.filter(s => s.pond === i && S.dex[s.id]).length;
// 调试：顶栏按钮或 D 键开关 → 门票免费、鱼塘全开（不改存档里的钱）
let DEBUG = localStorage.getItem('fishScoop_debug') === '1';
const pondUnlocked = i => DEBUG || i === 0 || dexCountPond(i - 1) >= UNLOCK_NEED;
const unlockedCount = () => PONDS.filter((_, i) => pondUnlocked(i)).length;
const freeTicketOK = () => S.money < PONDS[0].ticket && S.tank.length === 0;

// ============================================================
// 工具
// ============================================================
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0, DPR = 1;
// 顶栏实际占到的高度（手机上会换两行），鱼缸/鱼塘活动范围避开它
let TOP = 70;
function measureTop() { const el = document.querySelector('.topbar'); if (el) TOP = el.getBoundingClientRect().bottom + 24; }
function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cvs.width = W * DPR; cvs.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    measureTop();
}
addEventListener('resize', resize);
resize();

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash(n) { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
// 和原 demo 一样的正弦叠加噪声
function simpleNoise(x, y, z) {
    const n1 = Math.sin(x * 0.02 + z) * Math.cos(y * 0.02);
    const n2 = Math.sin(x * 0.05 - z * 0.5) * Math.cos(y * 0.05 + z * 0.3);
    const n3 = Math.sin(x * 0.1 + z * 0.7) * Math.cos(y * 0.1 - z * 0.5);
    return (n1 + n2 * 0.5 + n3 * 0.25) / 1.75;
}
function pickWeighted(list) {
    const total = list.reduce((a, s) => a + s.spawn, 0);
    let r = Math.random() * total;
    for (const s of list) { if ((r -= s.spawn) <= 0) return s; }
    return list[list.length - 1];
}

// ============================================================
// 音效（WebAudio 合成，不需要素材）
// ============================================================
let AC = null;
function audio() {
    if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    if (AC && AC.state === 'suspended') AC.resume();
}
let NOISE = null;
function noiseSrc() {
    if (!NOISE) {
        NOISE = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
        const d = NOISE.getChannelData(0);
        for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = AC.createBufferSource();
    src.buffer = NOISE; src.loop = true;
    return src;
}
function noise(dur, type, freq, q, vol, delay = 0) {
    if (!AC) return;
    const t0 = AC.currentTime + delay;
    const src = noiseSrc();
    const flt = AC.createBiquadFilter(); flt.type = type; flt.frequency.value = freq; flt.Q.value = q;
    const g = AC.createGain();

// 鱼的绘制（俯视，朝 +x）
// ============================================================
function bodyPath(c, L, Wd) {
    c.beginPath();
    c.moveTo(L * 0.5, 0);
    c.bezierCurveTo(L * 0.42, -Wd * 0.62, -L * 0.1, -Wd * 0.62, -L * 0.42, 0);
    c.bezierCurveTo(-L * 0.1, Wd * 0.62, L * 0.42, Wd * 0.62, L * 0.5, 0);
    c.closePath();
}
function drawFishShape(c, sp, L, swing, seed, silhouette) {
    const Wd = L * 0.5;
    // 尾巴
    c.save();
    c.translate(-L * 0.36, 0);
    c.rotate(swing);
    c.beginPath();
    c.moveTo(0, 0);
    c.lineTo(-L * 0.42, -Wd * 0.6);
    c.quadraticCurveTo(-L * 0.3, 0, -L * 0.42, Wd * 0.6);
    c.closePath();
    c.fillStyle = silhouette ? silhouette : (sp.pat === 'tail' ? sp.c2 : sp.c1);
    c.globalAlpha = silhouette ? 1 : 0.92;
    c.fill();
    c.restore();
    // 身体
    bodyPath(c, L, Wd);
    c.fillStyle = silhouette || sp.c1;
    c.fill();
    if (silhouette) return;
    // 花纹
    c.save();
    bodyPath(c, L, Wd);
    c.clip();
    c.fillStyle = sp.c2;
    if (sp.pat === 'spots') {
        for (let i = 0; i < 4; i++) {
            c.beginPath();
            c.arc((hash(seed + i) - 0.5) * L * 0.6, (hash(seed + i + 9) - 0.5) * Wd * 0.7, Wd * (0.12 + hash(seed + i + 20) * 0.12), 0, TAU);
            c.fill();
        }
    } else if (sp.pat === 'koi') {
        for (let i = 0; i < 2; i++) {
            c.beginPath();
            c.ellipse((i ? -0.14 : 0.18) * L + (hash(seed + i) - 0.5) * L * 0.12, (hash(seed + i + 5) - 0.5) * Wd * 0.5,
                L * (0.15 + hash(seed + i + 7) * 0.08), Wd * (0.32 + hash(seed + i + 3) * 0.15), hash(seed + i) * 2, 0, TAU);
            c.fill();
        }
    } else if (sp.pat === 'stripe') {
        for (let i = 0; i < 3; i++) c.fillRect((-0.18 + i * 0.17) * L, -Wd, L * 0.05, Wd * 2);
    } else if (sp.pat === 'stars') {
        // 最多三个点
        const n = hash(seed + 33) < 0.5 ? 2 : 3;
        for (let i = 0; i < n; i++) {
            c.beginPath();
            c.arc((hash(seed + i) - 0.5) * L * 0.7, (hash(seed + i + 9) - 0.5) * Wd * 0.8, L * 0.025 + hash(seed + i + 4) * L * 0.02, 0, TAU);
            c.fill();
        }
    }
    // 脊背高光
    c.globalAlpha = 0.28;
    c.fillStyle = '#fff';
    c.beginPath();
    c.ellipse(L * 0.05, -Wd * 0.05, L * 0.28, Wd * 0.1, 0, 0, TAU);
    c.fill();
    c.restore();
    // 眼睛
    c.fillStyle = sp.eye || '#1a1a1a';
    c.beginPath(); c.arc(L * 0.3, -Wd * 0.22, L * 0.035, 0, TAU); c.fill();
    c.beginPath(); c.arc(L * 0.3, Wd * 0.22, L * 0.035, 0, TAU); c.fill();
}
function fishLen(a) { return a.S.len * a.size; }
function drawFishShadow(a, L) {
    ctx.save();
    ctx.translate(a.x + 5, a.y + 8);
    ctx.rotate(a.ang);
    bodyPath(ctx, L, L * 0.5);

    ctx.restore();
}
function drawFishGlow(a, L) {
    if (!a.S.glow) return;

    g.addColorStop(0, a.S.glow);

function drawFish(a, L, outline) {

    if (known && sp.glow) {
        const gr = g.createRadialGradient(0, 0, 0, 0, 0, L * 0.9);
        gr.addColorStop(0, sp.glow); gr.addColorStop(1, 'rgba(0,0,0,0)');
        g.globalAlpha = 0.45; g.fillStyle = gr; g.fillRect(-L, -L, L * 2, L * 2); g.globalAlpha = 1;

// ============================================================
let particles = [], ripples = [];
function ripple(x, y, max, a = 0.5) { ripples.push({ x, y, r: 4, max, a }); }
function spawnDrops(x, y, n, spread, color = 'rgba(220,240,255,0.9)') {
    for (let i = 0; i < n; i++) {
        const ang = rand(0, TAU), sp = rand(1, 5);
        particles.push({ type: 'drop', x: x + Math.cos(ang) * spread * Math.random(), y: y + Math.sin(ang) * spread * Math.random(),
            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: rand(0.4, 0.8), max: 0.8, size: rand(1.5, 3.5), color });
    }
}
function spawnCoins(x, y, n) {
    const el = document.getElementById('moneyPill').getBoundingClientRect();
    for (let i = 0; i < n; i++) {
        particles.push({ type: 'coin', x0: x + rand(-10, 10), y0: y + rand(-10, 10), x1: el.left + el.width / 2, y1: el.top + el.height / 2,
            t: -i * 0.04, dur: rand(0.5, 0.7), arc: rand(-120, -40) });
    }
}
function floatText(x, y, text, color) {
    particles.push({ type: 'text', x, y, vx: 0, vy: -0.8, life: 1.1, max: 1.1, text, color });
}
function updateParticles(dt, f) {
    for (const p of particles) {
        if (p.type === 'coin') { p.t += dt; continue; }
        p.x += p.vx * f; p.y += p.vy * f;
        p.vx *= Math.pow(0.92, f); p.vy *= Math.pow(0.92, f);
        if (p.rot !== undefined) p.rot += p.vr * f;
        p.life -= dt;
    }
    particles = particles.filter(p => p.type === 'coin' ? p.t < p.dur : p.life > 0);
    for (const r of ripples) { r.r += (r.max - r.r) * (1 - Math.pow(0.94, f)) + 0.4 * f; r.a -= dt * 0.7; }
    ripples = ripples.filter(r => r.a > 0);
}
function drawRipples() {
    ctx.lineWidth = 2;
    for (const r of ripples) {
        ctx.strokeStyle = `rgba(255,255,255,${r.a})`;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, TAU); ctx.stroke();
        ctx.strokeStyle = `rgba(255,255,255,${r.a * 0.4})`;
        ctx.beginPath(); ctx.arc(r.x, r.y, r.r * 0.7, 0, TAU); ctx.stroke();
    }
}
function drawParticles() {
    for (const p of particles) {
        if (p.type === 'coin') {
            if (p.t < 0) continue;
            const k = p.t / p.dur, e = k * k;
            const x = p.x0 + (p.x1 - p.x0) * e, y = p.y0 + (p.y1 - p.y0) * e + Math.sin(k * Math.PI) * p.arc;
            ctx.fillStyle = '#ffd34a';
            ctx.beginPath(); ctx.arc(x, y, 6 * (1 - k * 0.4), 0, TAU); ctx.fill();
            ctx.fillStyle = '#fff6c0';
            ctx.beginPath(); ctx.arc(x - 1.5, y - 1.5, 2, 0, TAU); ctx.fill();
            continue;
        }
        const a = clamp(p.life / p.max, 0, 1);
        if (p.type === 'spark') {
            ctx.globalCompositeOperation = 'lighter';
            ctx.globalAlpha = a;
            ctx.fillStyle = p.color;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (0.5 + a * 0.5), 0, TAU); ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        } else if (p.type === 'text') {

            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, TAU); ctx.fill();
        }

function makeFish(spId, x, y, size) {
    return {
        S: SP[spId], sp: spId, size: size ?? rand(0.8, 1.3), x, y, vx: rand(-1, 1), vy: rand(-1, 1),
        ang: rand(0, TAU), phase: rand(0, TAU), seed: Math.floor(rand(1, 9999)), flee: 0,
        pers: {
            spd: rand(0.6, 1.4), sep: rand(0.5, 2.5), ali: rand(0.2, 1.6), coh: rand(0.2, 1.8),
            space: rand(0.9, 1.6), wander: rand(0.4, 2), wa: rand(0, TAU), ring: rand(0.1, 1.15),
        },
    };
}
function animateFish(a, f, turn = 0.15) {
    const spd = Math.hypot(a.vx, a.vy);
    a.phase += (0.12 + spd * 0.25) * f;
    if (spd > 0.05) {
        let d = Math.atan2(a.vy, a.vx) - a.ang;
        while (d > Math.PI) d -= TAU;
        while (d < -Math.PI) d += TAU;
        a.ang += d * (1 - Math.pow(1 - turn, f));
    }
}

let mode = 'tank';

function startPond(idx, free) {
    mode = 'pond';

    closeModal();
    hidePop();
    const list = SPECIES.filter(s => s.pond === idx);
    const count = Math.round(clamp(W * H / 17000, 34, 60));
    const ids = [];
    ids.push(list.find(s => s.rarity === 2).id);
    ids.push(list.find(s => s.rarity === 1).id);
    while (ids.length < count) ids.push(pickWeighted(list).id);
    const fish = ids.map(id => {
        const a = makeFish(id, 0, 0);
        const th = rand(0, TAU), rx = W * 0.4 * a.pers.ring, ry = H * 0.34 * a.pers.ring;
        a.x = W / 2 + Math.cos(th) * rx;
        a.y = H / 2 + Math.sin(th) * ry;
        return a;
    });
    const deco = [];
    if (idx === 1) {
        for (let i = 0; i < 6; i++) deco.push({ x: rand(60, W - 60), y: rand(TOP + 20, H - 60), r: rand(34, 60), rot: rand(0, TAU), flower: Math.random() < 0.35 });
    } else if (idx === 2) {
        for (let i = 0; i < 60; i++) deco.push({ x: rand(0, W), y: rand(0, H), s: rand(0.5, 1.8), ph: rand(0, TAU) });
    } else {
        for (let i = 0; i < 26; i++) deco.push({ x: rand(0, W), y: Math.random() < 0.5 ? rand(H * 0.85, H) : rand(0, H * 0.12), r: rand(6, 16), c: Math.floor(rand(0, 3)) });
    }
    // 一张票三张网（破网票只有一张小网）；每张网的收获先放进 bag，三张用完一起结算
    const nets = free ? 1 : NETS_PER_TICKET;
    pond = { idx, fish, deco, free, nets, netsLeft: nets, bag: [], log: [] };
    net = newNet();

}
const NETS_PER_TICKET = 3;
function newNet() {
    const free = pond.free, idx = pond.idx;
    const cracks = [];
    for (let i = 0; i < 7; i++) {
        const a0 = rand(0, TAU), pts = [];
        let r = NET_R * rand(0.75, 1), a = a0;
        for (let k = 0; k < 4; k++) { pts.push([Math.cos(a) * r, Math.sin(a) * r]); r -= rand(8, 16); a += rand(-0.35, 0.35); }
        cracks.push({ pts, at: rand(0.15, 0.6) });
    }
    const n = {
        x: pointer.inside ? pointer.x : W / 2, y: pointer.inside ? pointer.y : H / 2,
        r: free ? NET_R * 0.82 : NET_R, max: free ? 70 : PONDS[idx].net, dur: free ? 70 : PONDS[idx].net,
        drain: 6, phase: 'aim', inWater: false, alarm: 0, speed: 0, t: 0,
        liveN: 0, liveW: 0, caught: [], cracks, done: false, ha: handleAngle(),

    if (pointer.inside) {

// 一张网收完：记下这一网的结果；还有网就换新网，没网了就结算
function finishNet() {
    const torn = net.phase === 'tear';
    const caught = torn ? [] : net.caught.map(c => c.a);
    const value = caught.reduce((v, a) => v + Math.max(1, Math.round(a.S.value * a.size)), 0);
    pond.log.push({ torn, n: caught.length, value, why: net.tearWhy });
    pond.bag.push(...caught);
    const i = pond.log.length;
    if (pond.netsLeft > 0) {
        toast(torn ? `第 ${i} 网：纸破了，这一网的鱼跑了` : caught.length ? `第 ${i} 网：捞到 ${caught.length} 条 ¥${value}` : `第 ${i} 网：空网`, 1600);
        net = newNet();
        updateUI();
    } else {
        showResult(pond.bag, pond.log);
    }
}

// 贵鱼要游到网的内圈才算稳，在边上提网会溜
const HOLD = [0.92, 0.65, 0.45];
const inNetRange = a => Math.hypot(a.x - net.x, a.y - net.y) < net.r * 0.92;
const secured = a => Math.hypot(a.x - net.x, a.y - net.y) < net.r * HOLD[a.S.rarity];
// 网里的鱼（计数/重量/描边都按这个算）
function fishInNet() { return pond.fish.filter(inNetRange); }
// 名贵鱼在内圈必中；在网里但没进内圈按位置算概率，越靠网边越容易溜
const SLIP_CHANCE = [null, [0.75, 0.25], [0.55, 0.1]];
function catchChance(a) {
    if (secured(a)) return 1;
    const h = HOLD[a.S.rarity], d = Math.hypot(a.x - net.x, a.y - net.y) / net.r;
    const t = clamp((d - h) / (0.92 - h), 0, 1), c = SLIP_CHANCE[a.S.rarity];
    return c[0] + (c[1] - c[0]) * t;
}
const weightOf = list => list.reduce((s, a) => s + a.S.weight * a.size, 0);
// 手（鼠标/手指）握在把手中段，网在手的左上方，不会被手挡住；右手持网，把手固定朝右下
const handleLen = r => r + 42;
function handleAngle() { return Math.PI * 0.3; }
function netTargetFromPointer() {
    const a = net.ha, g = handleLen(net.r);
    return { x: pointer.x - Math.cos(a) * g, y: pointer.y - Math.sin(a) * g };
}

// 网还没静下来（刚下网/明显拖动）时名贵鱼不敢靠近；静够久就会好奇地游过来
const rareWary = a => net.alarm * a.S.shy > 0.15 || net.speed > 1.5;
function dipNet() {
    net.phase = 'dip';
    net.inWater = true;
    pond.netsLeft--;
    net.ha = handleAngle();
    const tp = netTargetFromPointer();
    net.x = tp.x; net.y = tp.y;
    net.alarm = Math.min(1, net.alarm + 0.85);
    // 拍水惊鱼：网下和附近的鱼"嗖"地窜开。贵鱼反应快窜得远，普通鱼有的会发呆
    for (const a of pond.fish) {
        const dx = a.x - net.x, dy = a.y - net.y, d = Math.hypot(dx, dy);
        if (d > net.r * 1.7) continue;
        const ang = d < 1 ? rand(0, TAU) : Math.atan2(dy, dx) + rand(-0.4, 0.4);
        const sp = a.S.rarity === 2 ? rand(18, 20) : a.S.rarity === 1 ? rand(16, 18) : (Math.random() < 0.25 ? rand(2, 5) : rand(10, 14));
        a.vx = Math.cos(ang) * sp; a.vy = Math.sin(ang) * sp; a.flee = 1;
        a.dart = 0.35; a.dartSpd = sp;
        // 下网当帧先窜出一段，保证按下立刻松手也来不及捞到贵鱼
        a.x += a.vx * 2.5; a.y += a.vy * 2.5;
    }
    ripple(net.x, net.y, net.r * 2.4, 0.7);
    ripple(net.x, net.y, net.r * 1.5, 0.5);
    spawnDrops(net.x, net.y, 22, net.r);
    sfx.splash(); haptic(8);
    updateUI();
}
function liftNet() {
    const cand = fishInNet();
    const w = weightOf(cand);
    const inNet = cand.filter(a => Math.random() < catchChance(a));
    net.inWater = false;
    ripple(net.x, net.y, net.r * 2, 0.6);
    if (cand.length && w > net.dur) { net.tearWhy = `网上 ${cand.length} 条，重 ${Math.round(w)} > 承重 ${Math.round(net.dur)}`; tearNet(cand); return; }
    // 没捞住的名贵鱼：溜走
    for (const a of cand) {
        if (inNet.includes(a)) continue;
        const dx = a.x - net.x, dy = a.y - net.y, d = Math.hypot(dx, dy) || 1;
        a.vx = dx / d * 7; a.vy = dy / d * 7; a.flee = 1;
        ripple(a.x, a.y, 30, 0.6);
        floatText(a.x, a.y - 16, '溜了！', RARITY[a.S.rarity].color);
    }
    net.phase = 'lift';
    net.t = 0;
    net.caught = inNet.map(a => ({ a, ox: a.x - net.x, oy: a.y - net.y }));
    pond.fish = pond.fish.filter(a => !inNet.includes(a));
    spawnDrops(net.x, net.y, 30, net.r);
    sfx.lift();
    if (inNet.length >= 3) { hitstop = 0.09; shake = 6; }
    if (inNet.some(a => a.S.rarity === 2)) { sfx.fanfare(); shake = 9; }
    haptic(inNet.some(a => a.S.rarity === 2) ? 12 : inNet.length >= 3 ? 10 : inNet.length ? 8 : 5, inNet.some(a => a.S.rarity === 2) ? 3 : inNet.length >= 3 ? 2 : 1);
    updateUI();
}
function tearNet(inNet) {
    net.phase = 'tear';
    net.inWater = false;
    net.t = 0;
    net.tearAng = rand(0, TAU);
    sfx.tear(); haptic(15, 2);
    shake = 16;
    for (const a of inNet) {
        const ang = rand(0, TAU), sp = rand(5, 9);
        a.vx = Math.cos(ang) * sp; a.vy = Math.sin(ang) * sp; a.flee = 1;
    }
    for (let i = 0; i < 18; i++) {
        const ang = rand(0, TAU), sp = rand(1, 4);
        particles.push({ type: 'paper', x: net.x + Math.cos(ang) * net.r * 0.5, y: net.y + Math.sin(ang) * net.r * 0.5,
            vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: rand(0.8, 1.4), max: 1.4, size: rand(3, 7), rot: rand(0, TAU), vr: rand(-0.2, 0.2) });
    }
    spawnDrops(net.x, net.y, 26, net.r);

function updateNet(dt, f) {
    if (!net) return;
    net.t += dt;
    if (net.phase === 'aim' || net.phase === 'dip') {
        // 水里有阻力，跟手更慢
        const k = 1 - Math.pow(1 - (net.inWater ? 0.14 : 0.4), f);
        const ox = net.x, oy = net.y;
        if (pointer.inside || net.inWater) {
            net.ha += (handleAngle() - net.ha) * (1 - Math.pow(0.9, f));
            const tp = netTargetFromPointer();
            net.x += (tp.x - net.x) * k;
            net.y += (tp.y - net.y) * k;
        }
        net.speed = f > 0 ? Math.hypot(net.x - ox, net.y - oy) / f : 0;
        if (net.inWater) {
            net.alarm = Math.min(1, net.alarm + Math.max(0, net.speed - 0.3) * 0.035 * f);
            net.dur -= (net.drain + net.speed * 1.1) * dt;
            if (net.speed > 0.8) swish(Math.min(0.45, net.speed / 14), Math.min(0.6, net.speed / 20));
            // 金色纸网：在水里移动时拖一点金粉
            if (S.master && net.speed > 0.5 && Math.random() < 0.5 * f) {
                const ga = rand(0, TAU);
                particles.push({ type: 'spark', x: net.x + Math.cos(ga) * net.r, y: net.y + Math.sin(ga) * net.r, vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3),
                    life: rand(0.5, 1), max: 1, size: rand(1, 2.4), color: '#ffd34a' });
            }
            if (net.speed > 2.5 && Math.random() < 0.3 * f) ripple(net.x + rand(-1, 1) * net.r, net.y + rand(-1, 1) * net.r, 30, 0.35);
            const inNet = fishInNet();
            net.liveN = inNet.length;
            net.liveW = weightOf(inNet);
            if (net.dur <= 0) { net.dur = 0; net.tearWhy = '在水里泡太久，纸泡烂了'; tearNet(inNet); }
        } else if (pointer.inside) {
            // 网在水面上方，影子也会吓到鱼
            net.alarm = Math.min(1, net.alarm + Math.max(0, net.speed - 0.5) * 0.006 * f);
        }
        net.alarm *= Math.pow(0.4, dt);
    }
    if (net.phase === 'lift') {
        for (const c of net.caught) {
            c.a.flop = Math.sin(T * 22 + c.a.seed) * 0.6;
            c.a.ang += Math.sin(T * 13 + c.a.seed) * 0.04;
            c.a.phase += 0.5 * f;
        }
        if (Math.random() < 0.5 * f) spawnDrops(net.x + rand(-1, 1) * net.r * 0.8, net.y + rand(-1, 1) * net.r * 0.8, 1, 0);
    }
    if (!net.done && ((net.phase === 'lift' && net.t > 1.4) || (net.phase === 'tear' && net.t > 1.3))) {
        net.done = true;
        finishNet();
    }
}

function updatePondFish(dt, f) {
    const cx = W / 2, cy = H / 2, tm = T * 0.3;
    const arr = pond.fish;
    for (const a of arr) {
        const sp = a.S;
        let sx = 0, sy = 0, avx = 0, avy = 0, px = 0, py = 0, n = 0, ns = 0;
        for (const b of arr) {
            if (a === b) continue;
            const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
            if (d2 < 6400) {
                const d = Math.sqrt(d2) || 0.01;
                n++; avx += b.vx; avy += b.vy; px += b.x; py += b.y;
                const ps = 24 * a.pers.space * a.size;
                if (d < ps) { const s = (ps - d) / ps; sx += dx / d * s; sy += dy / d * s; ns++; }
            }
        }
        let fx = 0, fy = 0;
        if (ns) { fx += sx / ns * 0.25 * a.pers.sep; fy += sy / ns * 0.25 * a.pers.sep; }
        if (n) {
            fx += (avx / n - a.vx) * 0.02 * a.pers.ali; fy += (avy / n - a.vy) * 0.02 * a.pers.ali;
            fx += (px / n - a.x) * 0.0005 * a.pers.coh; fy += (py / n - a.y) * 0.0005 * a.pers.coh;
        }
        // 椭圆洋流 + 噪声扰动（沿用原 demo 思路，每条鱼有自己的环半径）
        const rx = W * 0.4 * a.pers.ring, ry = H * 0.34 * a.pers.ring;
        const dx = a.x - cx, dy = a.y - cy;
        const nd = Math.sqrt(dx * dx / (rx * rx) + dy * dy / (ry * ry)) || 0.01;
        let tx = -dy / (ry * ry), ty = dx / (rx * rx);
        const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
        const nz = simpleNoise(a.x, a.y, tm), nz2 = simpleNoise(a.x + 1000, a.y + 1000, tm);
        const ang = nz2 * 0.6, c = Math.cos(ang), s = Math.sin(ang);
        const flow = (0.6 + nz * 0.3) * 0.035;
        const rl = Math.hypot(dx, dy) || 1;
        fx += (tx * c - ty * s) * flow - dx / rl * (nd - 1) * 0.04;
        fy += (tx * s + ty * c) * flow - dy / rl * (nd - 1) * 0.04;
        // 漫游
        a.pers.wa += (Math.random() - 0.5) * 0.3 * f;
        fx += Math.cos(a.pers.wa) * 0.012 * a.pers.wander;
        fy += Math.sin(a.pers.wa) * 0.012 * a.pers.wander;
        // 边界
        const m = 40;
        if (a.x < m) fx += (m - a.x) * 0.004;
        // 右手持网，屏幕最右边一条网够不着，鱼不往那里游
        if (a.x > W - 75) fx -= (a.x - W + 75) * 0.004;
        if (a.y < TOP) fy += (TOP - a.y) * 0.004;
        const bot = H - 110;
        if (a.y > bot) fy -= (a.y - bot) * 0.004;
        // 怕网：惊吓半径 = 网的"动静" × 胆小程度
        let flee = 0;
        if (net && (net.phase === 'aim' || net.phase === 'dip')) {
            const R = net.alarm * (net.inWater ? 110 : 90) * sp.shy;
            const ndx = a.x - net.x, ndy = a.y - net.y, d = Math.hypot(ndx, ndy) || 0.01;
            if (d < R) { const k = 1 - d / R; fx += ndx / d * k * 0.9; fy += ndy / d * k * 0.9; flee = k; }
        }
        // 名贵鱼好奇：网安静下来后慢慢游过来，进到网中间放慢停留——耐心等就能捞到
        if (sp.rarity > 0 && net && net.phase === 'dip' && !rareWary(a)) {
            const cdx = net.x - a.x, cdy = net.y - a.y, cd = Math.hypot(cdx, cdy) || 0.01;
            if (cd < 480) {
                a.curious = Math.min(1, (a.curious || 0) + dt * 1.0);
                const c = a.curious;
                fx *= 1 - 0.6 * c; fy *= 1 - 0.6 * c;
                const want = Math.min(1, cd / 50);
                fx += cdx / cd * 0.04 * c * want; fy += cdy / cd * 0.04 * c * want;
                if (cd < net.r * 0.6) { fx -= a.vx * 0.04 * c; fy -= a.vy * 0.04 * c; }
            }
        } else a.curious = 0;
        a.flee = Math.max(a.flee * Math.pow(0.3, dt), flee);
        const fm = Math.hypot(fx, fy), maxF = 0.06 + a.flee * 0.8;
        if (fm > maxF) { fx *= maxF / fm; fy *= maxF / fm; }
        a.vx += fx * f; a.vy += fy * f;
        const damp = Math.pow(0.985, f);
        a.vx *= damp; a.vy *= damp;
        let ms = 1.0 * a.pers.spd * (1 + a.flee * 4) * (a.flee > 0.9 ? 1.6 : 1);
        if (a.dart > 0) { a.dart -= dt; ms = Math.max(ms, a.dartSpd); }
        const v = Math.hypot(a.vx, a.vy);
        if (v > ms) { a.vx *= ms / v; a.vy *= ms / v; }
        a.x += a.vx * f; a.y += a.vy * f;
        animateFish(a, f);
        // 传说鱼拖金粉
        if (sp.rarity === 2 && Math.random() < 0.35 * f) {
            const L = fishLen(a);
            particles.push({ type: 'spark', x: a.x - Math.cos(a.ang) * L * 0.5 + rand(-3, 3), y: a.y - Math.sin(a.ang) * L * 0.5 + rand(-3, 3),
                vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3), life: rand(0.5, 1), max: 1, size: rand(1, 2.6), color: sp.glow });
        }
    }
}

function drawPondWater() {
    const P = PONDS[pond.idx];
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, P.top); g.addColorStop(1, P.bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    // 焦散光斑
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 9; i++) {
        const x = W * (0.5 + 0.45 * Math.sin(T * 0.13 + i * 1.7)), y = H * (0.5 + 0.45 * Math.cos(T * 0.11 + i * 2.3));
        const r = Math.min(W, H) * (0.18 + 0.06 * Math.sin(T * 0.5 + i));
        const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, pond.idx === 2 ? 'rgba(120,120,255,0.07)' : 'rgba(200,255,255,0.07)');
        rg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg;
        ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    ctx.globalCompositeOperation = 'source-over';
    if (pond.idx === 0) {
        const cols = ['rgba(200,190,160,0.35)', 'rgba(150,170,160,0.35)', 'rgba(230,220,200,0.3)'];
        for (const d of pond.deco) { ctx.fillStyle = cols[d.c]; ctx.beginPath(); ctx.ellipse(d.x, d.y, d.r, d.r * 0.7, d.x, 0, TAU); ctx.fill(); }
    } else if (pond.idx === 2) {
        // 月亮倒影 + 星星

        const mg = ctx.createRadialGradient(mx, my, 0, mx, my, mr * 2.2);
        mg.addColorStop(0, 'rgba(255,255,230,0.35)'); mg.addColorStop(0.4, 'rgba(255,255,230,0.12)'); mg.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = mg; ctx.fillRect(mx - mr * 2.2, my - mr * 2.2, mr * 4.4, mr * 4.4);
        ctx.fillStyle = 'rgba(255,255,235,0.5)';
        ctx.beginPath(); ctx.ellipse(mx + Math.sin(T * 1.3) * 2, my, mr, mr * (0.95 + Math.sin(T * 1.7) * 0.03), 0, 0, TAU); ctx.fill();
        for (const d of pond.deco) {
            ctx.globalAlpha = 0.3 + 0.5 * (0.5 + 0.5 * Math.sin(T * 2 + d.ph));
            ctx.fillStyle = '#fff';
            ctx.fillRect(d.x, d.y, d.s, d.s);
        }
        ctx.globalAlpha = 1;
    }
}
function drawLilyPads() {

}
function drawLilyPad(d) {
    {

}

function drawNetUnder() {
    if (!net || !net.inWater) return;
    const ratio = net.dur / net.max;
    ctx.save();
    ctx.translate(net.x, net.y);
    // 下沉过程：从水面那种偏白、略大，渐渐沉成水下的半透明
    ctx.beginPath(); ctx.arc(0, 0, net.r, 0, TAU);
    ctx.fillStyle = `rgba(235,245,255,${0.08 + 0.25 * ratio})`;
    ctx.fill();
    ctx.lineWidth = 1.3;
    for (const c of net.cracks) {
        if (ratio > c.at) continue;
        ctx.strokeStyle = `rgba(255,255,255,${Math.min(0.8, (c.at - ratio) * 3)})`;
        ctx.beginPath();
        c.pts.forEach((p, i) => i ? ctx.lineTo(p[0] * net.r / NET_R, p[1] * net.r / NET_R) : ctx.moveTo(p[0] * net.r / NET_R, p[1] * net.r / NET_R));
        ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, net.r, 0, TAU);
    ctx.lineWidth = 5; ctx.strokeStyle = S.master ? 'rgba(235,185,60,0.85)' : 'rgba(200,70,55,0.8)';
    ctx.stroke();
    ctx.restore();
}
function drawHandle(r, lift) {

    ctx.lineWidth = 3; ctx.strokeStyle = S.master ? '#fff0a8' : '#ff8f80';
    ctx.beginPath(); ctx.moveTo(Math.cos(a) * r - 2, Math.sin(a) * r - 2); ctx.lineTo(Math.cos(a) * (r + 82 + lift) - 2, Math.sin(a) * (r + 82 + lift) - 2); ctx.stroke();
}
function drawRim(r) {

    ctx.lineWidth = 6; ctx.strokeStyle = S.master ? '#ffcf3a' : '#e04a3e'; ctx.stroke();

}
function drawNetAbove() {
    if (!net) return;

        ctx.save(); ctx.translate(net.x, net.y);

        const txt = net.liveN === 0 ? '等鱼游过来…' : `🐟${net.liveN}  重 ${Math.round(net.liveW)} / 承重 ${Math.round(net.dur)}`;
        ctx.font = '700 14px -apple-system, "PingFang SC", sans-serif';
        const tw = ctx.measureText(txt).width;
        const jx = load >= 1 ? rand(-1.5, 1.5) : 0;
        ctx.fillStyle = 'rgba(0,10,20,0.6)';
        roundRect(-tw / 2 - 10 + jx, -r - 46, tw + 20, 26, 13); ctx.fill();

        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(txt, jx, -r - 33);
        ctx.restore();
    } else if (net.phase === 'lift') {
        const p = Math.min(1, net.t / 0.25), e = 1 - Math.pow(1 - p, 3);
        const sc = 1 + 0.14 * e;
        ctx.fillStyle = `rgba(0,15,25,${0.25 * e})`;
        ctx.beginPath(); ctx.arc(net.x + 22 * e, net.y + 32 * e, r, 0, TAU); ctx.fill();
        ctx.save(); ctx.translate(net.x, net.y); ctx.scale(sc, sc);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU);
        ctx.fillStyle = 'rgba(235,245,255,0.45)'; ctx.fill();
        drawRim(r); drawHandle(r, 0);
        ctx.restore();
        for (const c of net.caught) {
            c.a.x = net.x + c.ox * sc; c.a.y = net.y + c.oy * sc;
            const L = fishLen(c.a) * sc;
            drawFishGlow(c.a, L);
            drawFish(c.a, L);

        const k = Math.min(1, net.t / 0.9);
        ctx.save(); ctx.translate(net.x, net.y);
        for (const side of [-1, 1]) {
            ctx.save();

            ctx.translate(nx * k * 26, ny * k * 26);

            ctx.arc(0, 0, r, net.tearAng + (side > 0 ? 0 : Math.PI), net.tearAng + (side > 0 ? Math.PI : TAU));
            ctx.closePath();
            ctx.fillStyle = `rgba(235,245,255,${0.4 * (1 - k)})`;
            ctx.fill();
            ctx.restore();
        }
        drawRim(r); drawHandle(r, 0);
        ctx.restore();
    }
}

let tankFish = [];
let selected = null;
function tankRect() {
    const avail = H - TOP - 50;
    const w = Math.min(W * (W < 640 ? 0.92 : 0.88), 1000), h = Math.min(avail, W < 640 ? 900 : 600);
    return { x: (W - w) / 2, y: TOP + (avail - h) / 2, w, h };
}
function enterTank() {

    pond = null; net = null;
    closeModal();
    const R = tankRect();
    const keep = new Map(tankFish.map(a => [a.uid, a]));
    tankFish = S.tank.map(t => {
        if (keep.has(t.uid)) return keep.get(t.uid);
        const a = makeFish(t.sp, rand(R.x + 60, R.x + R.w - 60), rand(R.y + 60, R.y + R.h - 60), t.size);
        a.uid = t.uid;

}
// 鱼缸里普通鱼按品种成群，每个品种跟一个缓慢游走的"兴趣点"；稀有/传说鱼单独游
function tankGroups() {
    const ids = [];
    for (const a of tankFish) if (a.S.rarity === 0 && !ids.includes(a.sp)) ids.push(a.sp);
    return ids;
}
function tankAttractor(i, R) {
    // 大群游得慢、范围大，小群游得快
    const t = T * (0.035 + 0.012 * i);
    return {
        x: R.x + R.w * (0.5 + 0.36 * Math.sin(t * 1.3 + i * 2.6)),
        y: R.y + R.h * (0.5 + 0.32 * Math.sin(t * 0.9 + i * 1.7 + i * i * 0.5)),
    };
}
// ============================================================
// 投喂（纯观赏：不花钱，不影响体型/售价）
// ============================================================
let feedMode = false;
const food = [];
const feedDrag = { on: false, x: 0, y: 0, acc: 0 };
const FOOD_COLS = ['#c98a44', '#a9682e', '#e0a85a'];
function dropFood(x, y, n) {
    const R = tankRect();
    for (let i = 0; i < n && food.length < 80; i++) {
        const a = rand(0, TAU), d = rand(0, 22);
        food.push({ x: clamp(x + Math.cos(a) * d, R.x + 8, R.x + R.w - 8), y: clamp(y + Math.sin(a) * d, R.y + 8, R.y + R.h - 8),
            vx: Math.cos(a) * rand(0.1, 0.4), vy: Math.sin(a) * rand(0.1, 0.4), t: 0, r: rand(2.6, 3.8), c: FOOD_COLS[i % 3],
            float: FOOD_FLOAT * rand(0.7, 1.3), ph: rand(0, TAU) });
    }
    ripple(x, y, 26, 0.35);
    bubbles(3, 1100, 1800, 0.12, 0.035);
}
let lastEatSnd = 0;
function eatFood(p) {
    const i = food.indexOf(p);
    if (i < 0) return;
    food.splice(i, 1);
    ripple(p.x, p.y, 14, 0.3);
    const now = performance.now();
    if (now - lastEatSnd > 70) { lastEatSnd = now; bubble(rand(500, 800), 0.05, 0, 0.05); }
}
// 饲料一生：水面漂浮 → 慢慢下沉 → 躺在缸底，最后淡掉。鱼哪个阶段都能吃
const FOOD_FLOAT = 1.4, FOOD_SINK = 4, FOOD_LIFE = 20;
// 0=水面 1=缸底，下沉段先快后慢
function foodDepth(p) {
    const k = clamp((p.t - p.float) / FOOD_SINK, 0, 1);
    return 1 - (1 - k) * (1 - k);
}
function updateFood(dt, f) {
    for (let i = food.length - 1; i >= 0; i--) {
        const p = food[i];
        p.t += dt;
        const d = foodDepth(p);
        // 下沉时左右轻轻晃，沉到底就不动了
        const sway = d > 0 && d < 1 ? Math.sin(p.t * 2.2 + p.ph) * 0.12 * (1 - d) : 0;
        p.x += (p.vx + sway) * f; p.y += p.vy * f;
        p.vx *= Math.pow(d > 0 ? 0.9 : 0.97, f); p.vy *= Math.pow(d > 0 ? 0.9 : 0.97, f);
        if (p.t > FOOD_LIFE) food.splice(i, 1);
    }
}
function drawFood() {
    for (const p of food) {
        const d = foodDepth(p), floating = p.t < p.float;
        ctx.globalAlpha = clamp((FOOD_LIFE - p.t) / 2, 0, 1);
        // 水面上漂着轻轻起伏；越往下越小
        const bob = floating ? 1 + Math.sin(p.t * 5 + p.ph) * 0.06 : 1;
        const r = p.r * (1 - 0.3 * d) * bob;
        // 影子：在水面时离得远、很淡，沉到底时贴住饲料
        const so = 1 + (1 - d) * 7;
        ctx.fillStyle = `rgba(0,20,30,${0.1 + 0.2 * d})`;
        ctx.beginPath(); ctx.arc(p.x + so * 0.7, p.y + so, r * (1 + (1 - d) * 0.3), 0, TAU); ctx.fill();
        // 漂浮时周围一圈水面张力的小亮环
        if (floating) {
            ctx.strokeStyle = `rgba(255,255,255,${0.3 * (1 - p.t / p.float)})`;
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.arc(p.x, p.y, r * (1.8 + Math.sin(p.t * 3 + p.ph) * 0.2), 0, TAU); ctx.stroke();
        }
        ctx.fillStyle = p.c;
        ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
        // 隔着越深的水颜色越蓝越暗
        if (d > 0) {
            ctx.fillStyle = `rgba(28,100,128,${0.55 * d})`;
            ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, TAU); ctx.fill();
        }
        ctx.fillStyle = `rgba(255,240,210,${0.65 * (1 - d)})`;
        ctx.beginPath(); ctx.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.35, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
}
function updateTankFish(dt, f) {
    updateFood(dt, f);
    const R = tankRect(), margin = 80;
    const groups = tankGroups();
    const att = groups.map((_, i) => tankAttractor(i, R));
    for (const a of tankFish) {
        let sx = 0, sy = 0, avx = 0, avy = 0, px = 0, py = 0, n = 0;
        for (const b of tankFish) {
            if (a === b) continue;
            const dx = a.x - b.x, dy = a.y - b.y, d2 = dx * dx + dy * dy;
            if (d2 > 8100) continue;
            const d = Math.sqrt(d2) || 0.01;
            // 只跟同品种对齐/聚拢，避让对所有鱼生效
            if (b.sp === a.sp) { n++; avx += b.vx; avy += b.vy; px += b.x; py += b.y; }
            const ps = 60 * a.size * a.pers.space;
            if (d < ps) { sx += dx / d * (ps - d) / ps; sy += dy / d * (ps - d) / ps; }
        }
        let fx = sx * 0.05 * a.pers.sep, fy = sy * 0.05 * a.pers.sep;
        if (n) {
            fx += (avx / n - a.vx) * 0.03 * a.pers.ali; fy += (avy / n - a.vy) * 0.03 * a.pers.ali;
            fx += (px / n - a.x) * 0.0003 * a.pers.coh; fy += (py / n - a.y) * 0.0003 * a.pers.coh;
        }
        // 有饲料就去抢最近的一粒（所有鱼一样快），抢食时不跟鱼群
        // 刚吃完一粒要缓一下；饲料落水后 1 秒鱼才发现，留出漂浮→下沉的过程给人看
        a.full = Math.max(0, (a.full || 0) - dt);
        let tgt = null, td = 220;
        if (!a.full) for (const p of food) { if (p.t < 1) continue; const d = Math.hypot(p.x - a.x, p.y - a.y); if (d < td) { td = d; tgt = p; } }
        if (tgt) {
            const gx = tgt.x - a.x, gy = tgt.y - a.y, gd = td || 1;
            fx += gx / gd * 0.1; fy += gy / gd * 0.1;
            const L = fishLen(a) * 1.2;
            if (Math.hypot(a.x + Math.cos(a.ang) * L * 0.4 - tgt.x, a.y + Math.sin(a.ang) * L * 0.4 - tgt.y) < L * 0.3 + 4) { eatFood(tgt); a.full = 1; }
        }
        // 跟随自己品种的兴趣点（稀有/传说不跟）
        const gi = tgt ? -1 : groups.indexOf(a.sp);
        if (gi >= 0) {
            const g = att[gi], gx = g.x - a.x, gy = g.y - a.y, gd = Math.hypot(gx, gy) || 1;
            const pull = Math.min(1, gd / 200) * 0.016;
            fx += gx / gd * pull; fy += gy / gd * pull;
        }
        // 漫游
        a.pers.wa += (Math.random() - 0.5) * 0.25 * f;
        fx += Math.cos(a.pers.wa) * 0.008 * a.pers.wander; fy += Math.sin(a.pers.wa) * 0.008 * a.pers.wander;
        // 软边界：离壁 margin 内就开始转向，越近越强
        const ex = a.x - R.x, wx = R.x + R.w - a.x, ey = a.y - R.y, wy = R.y + R.h - a.y;
        if (ex < margin) fx += (1 - ex / margin) * 0.08;
        if (wx < margin) fx -= (1 - wx / margin) * 0.08;
        if (ey < margin) fy += (1 - ey / margin) * 0.08;
        if (wy < margin) fy -= (1 - wy / margin) * 0.08;
        const hold = a === selected;
        a.vx += fx * f; a.vy += fy * f;
        const damp = Math.pow(hold ? 0.85 : 0.99, f);
        a.vx *= damp; a.vy *= damp;
        a.flee = a.flee * Math.pow(0.2, dt);
        const ms = 0.9 * a.pers.spd * (1 + a.flee * 4) * (tgt ? 1.3 : 1);
        let v = Math.hypot(a.vx, a.vy);
        if (v > ms) { const k = Math.max(ms / v, Math.pow(0.9, f)); a.vx *= k; a.vy *= k; }
        // 保持最低游速，鱼不会停在原地发呆
        v = Math.hypot(a.vx, a.vy);
        const minS = hold ? 0 : 0.35 * a.pers.spd;
        if (v < minS && v > 0.001) { a.vx *= minS / v; a.vy *= minS / v; }
        a.x = clamp(a.x + a.vx * f, R.x + 12, R.x + R.w - 12);
        a.y = clamp(a.y + a.vy * f, R.y + 12, R.y + R.h - 12);
        animateFish(a, f, 0.1);
        if (a.S.rarity === 2 && Math.random() < 0.2 * f) {
            particles.push({ type: 'spark', x: a.x + rand(-6, 6), y: a.y + rand(-6, 6), vx: rand(-0.3, 0.3), vy: rand(-0.3, 0.3),
                life: rand(0.5, 1), max: 1, size: rand(1, 2.4), color: a.S.glow });
        }
    }
}
// 集齐鱼塘后鱼缸里的装饰，收拢在角落：左下 彩色鹅卵石；右上 荷叶荷花（浮在鱼上面）

function drawTank() {

    bg.addColorStop(0, '#2a1d14'); bg.addColorStop(1, '#140d08');

function sellFish(uids) {
    let total = 0;
    for (const uid of uids) {
        const i = S.tank.findIndex(t => t.uid === uid);
        if (i < 0) continue;
        total += fishValue(S.tank[i]);
        const a = tankFish.find(x => x.uid === uid);
        if (a) { spawnCoins(a.x, a.y, Math.min(8, 2 + Math.floor(fishValue(S.tank[i]) / 40))); spawnDrops(a.x, a.y, 10, 10); }
        S.tank.splice(i, 1);
    }
    tankFish = tankFish.filter(a => !uids.includes(a.uid));
    if (selected && uids.includes(selected.uid)) selected = null;
    S.money += total;
    save();
    sfx.coin(); haptic(8); setTimeout(() => sfx.coin(), 120);
    setTimeout(bumpMoney, 450);
    hidePop();
    updateUI();

}

// 全收集：左右下角喷礼花彩带。上升段：重力 + 空气阻力减速；下落段：纸片阻力大，速度很快趋近很低的终端速度慢慢飘，同时左右摆、翻面
const CONFETTI_COLORS = ['#ff5a7a', '#ffd34a', '#4ad6ff', '#7cff8a', '#b47bff', '#ff9a3c', '#ffffff'];
function confetti() {
    const cv = document.createElement('canvas');
    cv.className = 'confetti';
    cv.width = W * DPR; cv.height = H * DPR;
    document.body.appendChild(cv);
    const g = cv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const k = H / 800;                       // 按屏幕高度缩放速度和重力
    const GRAV = 1200 * k, DRAG = 1.5, VT = 110 * k;   // VT：纸片飘落的终端速度
    const ps = [];
    for (const side of [-1, 1]) {
        for (let i = 0; i < 70; i++) {
            const ang = (side < 0 ? -62 : -118) * Math.PI / 180 + rand(-0.32, 0.32);
            const sp = rand(1500, 2100) * k;
            const ribbon = Math.random() < 0.22;
            ps.push({
                x: side < 0 ? -10 : W + 10, y: H * 0.88, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
                rot: rand(0, TAU), vr: rand(-8, 8), flip: rand(0, TAU), vf: rand(6, 14),
                sway: rand(0, TAU), swayF: rand(2, 4), w: rand(6, 10), h: rand(10, 16),
                color: CONFETTI_COLORS[Math.floor(rand(0, CONFETTI_COLORS.length))],
                ribbon, trail: [], t: 0, life: rand(2.2, 2.8), delay: rand(0, 0.12),
            });
        }
    }
    let last = performance.now();
    (function tick(now) {
        const dt = Math.min((now - last) / 1000, 0.05); last = now;
        g.clearRect(0, 0, W, H);
        let alive = 0;
        for (const p of ps) {
            p.t += dt;
            if (p.t < p.delay) { alive++; continue; }
            if (p.t > p.life + p.delay) continue;
            alive++;
            if (p.vy < 0) {
                // 上升：重力 + 空气阻力
                p.vy += GRAV * dt;
                const damp = Math.exp(-DRAG * dt);
                p.vx *= damp; p.vy *= damp;
            } else {
                // 下落：竖直速度趋近终端速度；横向阻力大，叠加左右摆动
                p.vy += ((p.ribbon ? VT * 1.4 : VT) - p.vy) * Math.min(1, 4 * dt);
                p.vx *= Math.exp(-3 * dt);
                p.vx += Math.sin(p.t * p.swayF * TAU / 2 + p.sway) * 420 * k * dt;
            }
            p.x += p.vx * dt; p.y += p.vy * dt;
            p.rot += p.vr * dt; p.flip += p.vf * dt;
            const left = p.life + p.delay - p.t;
            g.globalAlpha = Math.min(1, left / 0.4);
            if (p.ribbon) {
                p.trail.push(p.x, p.y);
                if (p.trail.length > 24) p.trail.splice(0, 2);
                g.strokeStyle = p.color; g.lineWidth = 3.5; g.lineCap = 'round'; g.lineJoin = 'round';
                g.beginPath();
                for (let i = 0; i < p.trail.length; i += 2) {
                    // 彩带：沿轨迹加一点横向卷曲
                    const wob = Math.sin(p.t * 9 + i * 0.6) * 3;
                    i ? g.lineTo(p.trail[i] + wob, p.trail[i + 1]) : g.moveTo(p.trail[i] + wob, p.trail[i + 1]);
                }
                g.stroke();
            } else {
                const c = Math.cos(p.flip);
                g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, c);
                g.fillStyle = p.color;
                g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
                if (c < 0) { g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }  // 翻到背面略暗
                g.restore();
            }
        }
        g.globalAlpha = 1;
        if (alive) requestAnimationFrame(tick); else cv.remove();
    })(last);
}
function playUnlockQueue(events, done) {

// 鱼缸里的鱼可以起名（只在鱼缸里显示）。某个品种第一次起名时，这个名字成为该品种的系列名：
// 同种其他没名字的鱼按捞到顺序叫「小黄2号、小黄3号…」，以后再捞到的同种鱼接着往下编号；单条改名不影响别的鱼
const escHtml = str => str.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
function nameFish(t, name) {
    name = name.trim().slice(0, 8);
    if (!name) { delete t.name; save(); return 0; }
    t.name = name;
    S.series = S.series || {};
    let n = 0;
    if (!S.series[t.sp]) {
        const ser = S.series[t.sp] = { base: name, next: 2 };
        for (const o of S.tank) {
            if (o === t || o.sp !== t.sp || o.name) continue;
            o.name = ser.base + (ser.next++) + '号';
            n++;
        }
    }
    save();
    return n;
}
// 「卖掉普通鱼」跳过起过名的鱼；系列自动编号的（小黄2号、小黄3号…）照样可以卖
function isAutoName(t) {
    const ser = (S.series || {})[t.sp];
    return !!ser && t.name.startsWith(ser.base) && /^\d+号$/.test(t.name.slice(ser.base.length));

const bulkSellable = t => SP[t.sp].rarity === 0 && (!t.name || isAutoName(t));

    const v = sellFish(uids);
    const kept = S.tank.filter(t => SP[t.sp].rarity === 0).length;
    toast(`卖掉 ${uids.length} 条普通鱼 +¥${v}` + (kept ? `，起过名的 ${kept} 条留着` : ''));
};
$('modalBg').addEventListener('pointerdown', e => { if (e.target === $('modalBg') && mode === 'tank') closeModal(); });

// ============================================================
// 输入
// ============================================================
// 鱼缸里按住拖动 = 搅水，沿路持续吓鱼
const stir = { on: false, x: 0, y: 0, acc: 0, sound: 0 };
function inTankWater(x, y) { const R = tankRect(); return x > R.x && x < R.x + R.w && y > R.y && y < R.y + R.h; }
function scareTank(x, y, radius, power, dirX = 0, dirY = 0) {
    for (const a of tankFish) {
        const dx = a.x - x, dy = a.y - y, d = Math.hypot(dx, dy) || 1;
        if (d >= radius) continue;
        const k = 1 - d / radius;
        a.flee = Math.max(a.flee, k);
        a.vx += (dx / d + dirX * 0.6) * power * k;
        a.vy += (dy / d + dirY * 0.6) * power * k;
    }
}
cvs.addEventListener('pointermove', e => {
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
    if (feedDrag.on && mode === 'tank') {
        feedDrag.acc += Math.hypot(e.clientX - feedDrag.x, e.clientY - feedDrag.y);
        feedDrag.x = e.clientX; feedDrag.y = e.clientY;
        if (feedDrag.acc > 34 && inTankWater(e.clientX, e.clientY)) { feedDrag.acc = 0; dropFood(e.clientX, e.clientY, 2); }
        return;
    }
    if (!stir.on || mode !== 'tank') return;
    const dx = e.clientX - stir.x, dy = e.clientY - stir.y, d = Math.hypot(dx, dy);
    if (d < 1) return;
    stir.x = e.clientX; stir.y = e.clientY;
    if (!inTankWater(e.clientX, e.clientY)) return;
    scareTank(e.clientX, e.clientY, 130, Math.min(1.5, 0.25 + d * 0.06), dx / d, dy / d);
    stir.acc += d; stir.sound += d; stir.slosh = (stir.slosh || 0) + d;
    if (stir.acc > 26) { stir.acc = 0; ripple(e.clientX, e.clientY, 40, 0.45); }
    // 搅水只用水声：一路冒咕噜气泡（拖得越快越密）+ 隔一段一声低沉的拨水，不要持续的沙沙噪声
    if (stir.sound > 32) { stir.sound = 0; bubbles(2, 300, 900, 0.04, 0.08); }
    if (stir.slosh > 110) { stir.slosh = 0; wash(0.22, 600, 200, 0.07, 0, 0.04); bubble(rand(220, 320), 0.07, 0.02, 0.1); }
});
cvs.addEventListener('pointerleave', () => { if (!(net && net.inWater)) pointer.inside = false; });
cvs.addEventListener('pointerdown', e => {
    audio();
    pointer.x = e.clientX; pointer.y = e.clientY; pointer.inside = true;
    cvs.setPointerCapture(e.pointerId);
    if (mode === 'pond' && net && net.phase === 'aim') { dipNet(); return; }
    if (mode === 'tank' && feedMode) {
        if (inTankWater(e.clientX, e.clientY)) {
            dropFood(e.clientX, e.clientY, 6);
            Object.assign(feedDrag, { on: true, x: e.clientX, y: e.clientY, acc: 0 });
        }
        return;
    }
    if (mode === 'tank') {
        let best = null, bd = 1e9;
        for (const a of tankFish) {
            const d = Math.hypot(a.x - e.clientX, a.y - e.clientY);
            if (d < fishLen(a) * 0.9 && d < bd) { bd = d; best = a; }
        }
        if (best) { sfx.pick(); haptic(5); showPop(best); return; }
        hidePop();
        if (inTankWater(e.clientX, e.clientY)) {
            ripple(e.clientX, e.clientY, 70, 0.6);
            sfx.plop(); haptic(4);
            scareTank(e.clientX, e.clientY, 160, 4);
            Object.assign(stir, { on: true, x: e.clientX, y: e.clientY, acc: 0, sound: 0 });
        }
    }
});
function toggleDebug() {
    DEBUG = !DEBUG;
    localStorage.setItem('fishScoop_debug', DEBUG ? '1' : '0');
    toast(DEBUG ? '调试模式：开（门票免费、鱼塘全开）' : '调试模式：关');
    updateUI();
    if ($('modalBg').classList.contains('show') && mode === 'tank') showPondSelect();
}
$('btnDebug').onclick = toggleDebug;
addEventListener('keydown', e => { if (e.target.tagName === 'INPUT') return; if (e.code === 'KeyD' && !e.repeat) toggleDebug(); });
// 手机没有键盘：2 秒内连点左上角金钱 5 下，开关调试
let moneyTaps = [];
$('moneyPill').addEventListener('pointerdown', () => {
    const now = performance.now();
    moneyTaps = moneyTaps.filter(t => now - t < 2000);
    moneyTaps.push(now);
    if (moneyTaps.length >= 5) { moneyTaps = []; toggleDebug(); }
});
// 手机自动全屏：安卓 / iPad 第一次碰屏幕就进全屏；iPhone Safari 不支持网页全屏，提示添加到主屏幕
const isTouch = matchMedia('(pointer: coarse)').matches;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches || navigator.standalone === true;
const canFullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function tryFullscreen() {
    if (!isTouch || isStandalone || document.fullscreenElement || document.webkitFullscreenElement) return;
    const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req) return;
    try { const r = req.call(el, { navigationUI: 'hide' }); if (r && r.catch) r.catch(() => { }); } catch (e) { }
}
document.addEventListener('pointerdown', tryFullscreen, true);
if (isIOS && isTouch && !isStandalone && !canFullscreen && !localStorage.getItem('fishScoop_a2hs')) {
    $('a2hs').classList.remove('hidden');
    $('a2hsX').onclick = () => { $('a2hs').classList.add('hidden'); localStorage.setItem('fishScoop_a2hs', '1'); };
}
function onUp() { stir.on = false; feedDrag.on = false; if (mode === 'pond' && net && net.phase === 'dip') liftNet(); }
cvs.addEventListener('pointerup', onUp);
cvs.addEventListener('pointercancel', onUp);

// ============================================================
// 主循环
// ============================================================
let last = performance.now(), T = 0, hitstop = 0, shake = 0;
function frame(now) {
    let dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    if (hitstop > 0) { hitstop -= dt; dt = 0; }
    T += dt;
    const f = dt * 60;
    if (swishNode && performance.now() - swishT > 70) swish(0, 0);

    if (mode === 'pond' && pond) { updateNet(dt, f); updatePondFish(dt, f); }
    else updateTankFish(dt, f);
    updateParticles(dt, f);
    if (Math.abs(dispMoney - S.money) > 0.5) dispMoney += (S.money - dispMoney) * (1 - Math.pow(0.85, f));
    else dispMoney = S.money;
    $('moneyPill').textContent = DEBUG ? '¥ ∞ 调试' : '¥ ' + Math.round(dispMoney);
    if (mode === 'pond' && net) {
        const h = net.phase === 'aim' ? 'aim' : net.phase === 'dip' ? 'dip' : 'x';
        if (h !== frame.lastHint) { frame.lastHint = h; updateUI(); }
    }

    ctx.save();
    if (shake > 0.2) { ctx.translate(rand(-shake, shake), rand(-shake, shake)); shake *= Math.pow(0.85, f); } else shake = 0;
    if (mode === 'pond' && pond) {
        drawPondWater();
        drawNetUnder();
        for (const a of pond.fish) drawFishShadow(a, fishLen(a));
        for (const a of pond.fish) drawFishGlow(a, fishLen(a));
        const inNet = net && net.inWater;
        for (const a of pond.fish) drawFish(a, fishLen(a), inNet && inNetRange(a));
        drawLilyPads();
        drawRipples();
        drawNetAbove();
        // 暗角
        const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.4, W / 2, H / 2, Math.max(W, H) * 0.75);
        vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
        ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    } else {
        drawTank();
    }
    drawParticles();
    ctx.restore();
    requestAnimationFrame(frame);
}

enterTank();
if (!S.seen) {
    openModal(`<h2>🎣 捞金鱼</h2>
        <div class="sub" style="line-height:1.9;font-size:15px;opacity:.9">
        · 买一张门票有<b>三张纸网</b>，每张只能下一次<br>
        · <b>按住</b>把纸网放进水里，<b>松手</b>提起来<br>
        · 网一动鱼就跑，<b>静下来</b>它们才会游到网上<br>
        · 贵鱼要游到<b>网中间</b>才捞得稳，在网边上提网会溜（白色描边 = 稳了）<br>
        · 纸一直在泡软，网上的鱼越多越重——<b>超过承重纸就破，一条不剩</b><br>
        · 捞到的鱼进鱼缸，可以卖钱买下一张票；集齐图鉴解锁新鱼塘
        </div>
        <div class="actions"><button class="btn" id="mStart">开始</button></div>`);
    $('mStart').onclick = () => { audio(); sfx.click(); S.seen = true; save(); closeModal(); };
}
// 老存档：已经集齐但还没领过的奖励，打开游戏时补发
if (S.seen) setTimeout(() => playUnlockQueue(collectUnlockEvents([])), 600);
requestAnimationFrame(frame);
</script>
</body>
</html>
